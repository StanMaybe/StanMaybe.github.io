<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--Icon: fail.svg-->
    <link rel="icon" type="image/svg+xml" href="fail.svg">
    <!--Styles.css-->
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Iosevka+Charon:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">

<body>
    <h1 class="title">404 Error</h1>
    <p class="subtitle">If you clicked one of my accounts, it might be down, non-existent or removed.</p>
    <p class="contact">Contact stanlusoc@gmail.com for information.</p>
    <div class="sad-face" style="font-size: 20em;">:)</div>
    <script>
        const sadFace = document.querySelector('.sad-face');
        let angle = 0;
        sadFace.innerText = ':(';
        setInterval(() => {
            angle += 1;
            sadFace.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;
        }, 10);
    </script>
</body>
